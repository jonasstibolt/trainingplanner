{% extends "plans/base.html" %}

{% block title %}Edit {{ plan.title }}{% endblock %}

{% block content %}
  <div class="flex items-start justify-between gap-4">
    <div>
      <h1 class="h1">Edit plan</h1>
      <p class="muted">{{ plan.title }}</p>
    </div>

    <a class="btn-ghost" href="{% url 'plans:plan_detail' plan.pk %}">Cancel</a>
  </div>

  <div class="card mt-6">
    <form method="post" class="grid gap-4">
      {% csrf_token %}

      {# simple styling for default Django form output #}
      {{ form.as_p }}

      <div class="flex items-center gap-2">
        <button class="btn-primary" type="submit">Save</button>
        <a class="btn-secondary" href="{% url 'plans:plan_detail' plan.pk %}">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
